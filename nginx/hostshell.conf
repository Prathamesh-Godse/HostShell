# Fronts ttyd (internal, 127.0.0.1:7681) as the public site. ttyd talks
# to xterm.js over a websocket, so the Upgrade/Connection headers below
# are load-bearing — without them the terminal will connect but never
# receive output.
#
# TLS cert paths are placeholders — point these at your actual
# certificates (e.g. Let's Encrypt / certbot's default layout) before
# using this in production. Replace yourdomain.com throughout.

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:7681;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ttyd's websocket is long-lived (the whole terminal session) —
        # nginx's default proxy timeouts will kill idle connections well
        # before a visitor is done reading.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
