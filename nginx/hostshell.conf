# Fronts ttyd (internal, 127.0.0.1:7681) as the public site, for both
# domains at once — same backend, same content, two names. ttyd talks
# to xterm.js over a websocket, so the Upgrade/Connection headers below
# are load-bearing — without them the terminal will connect but never
# receive output.
#
# Bootstrap order matters here: certbot's --nginx plugin edits an
# EXISTING server block to add the 443/SSL half automatically — it
# can't create SSL config against certs that don't exist yet. Deploy
# ONLY the first (port 80) server block below first, confirm HTTP
# proxying works, then run certbot (see deploy notes), which will
# rewrite this file to add the 443 block and the redirect. Don't
# hand-write the 443 block against certs you haven't issued yet — you
# want the same nginx-plus-certbot bootstrap order you already
# documented for the ServerForge/LEMP work.

server {
    listen 80;
    listen [::]:80;
    server_name lanmanlab.com www.lanmanlab.com prathameshgodse.com www.prathameshgodse.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lanmanlab.com www.lanmanlab.com prathameshgodse.com www.prathameshgodse.com;

    # Path shown matches `certbot --nginx -d lanmanlab.com -d www.lanmanlab.com
    # -d prathameshgodse.com -d www.prathameshgodse.com` — certbot names the
    # cert directory after the FIRST -d argument, so it'll be
    # /etc/letsencrypt/live/lanmanlab.com/ even though the cert itself
    # covers all four names. Adjust here if you request certs differently
    # (e.g. two separate certs instead of one four-name cert).
    ssl_certificate     /etc/letsencrypt/live/lanmanlab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lanmanlab.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:7681;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ttyd's websocket is long-lived (the whole terminal session) —
        # nginx's default proxy timeouts will kill idle connections well
        # before a visitor is done reading.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
